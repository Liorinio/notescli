openapi: 3.0.3

info:
  title: Personal Notebook API
  description: REST API for managing personal notes.
  version: 1.0.0
  contact:
    email: user@server.com

tags:
  - name: Notes
    description: CRUD, search, and navigation operations on notes

paths:
  /notes:
    get:
      operationId: listNotes
      summary: List notes
      description: >
        Returns a paginated list of note metadata — id, type, title, createdAt,
        updatedAt. Content fields (text, list, url) are omitted.
        Equivalent to `nb note list`.
      tags: [ Notes ]
      parameters:
        - name: sort_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NoteType'
          description: Optional note type to filter or sort notes.
      responses:
        '200':
          description: List of note metadata

    post:
      operationId: createNote
      summary: Create a new note
      description: >
        Creates a new note.
        Equivalent to `nb note create simple|list|bookmark`.
      tags: [ Notes ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
            examples:
              simple:
                summary: Simple text note
                value:
                  type: "simple"
                  title: "My First Note"
                  text: "Hello world!"
              list:
                summary: List note
                value:
                  type: "listnote"
                  title: "Shopping list"
                  list: [ "Milk", "Eggs", "Bread" ]
              bookmark:
                summary: Bookmark note
                value:
                  type: "bookmark"
                  title: "FastAPI Docs"
                  url: "https://fastapi.tiangolo.com"
      responses:
        '201':
          description: Note created successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  /notes/metadata:
    get:
      operationId: showMetadata
      summary: List notes (metadata only)
      tags: [ Notes ]
      responses:
        '200':
          description: List notes' metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - message
                properties:
                  metadata:
                    type: object
                    description: The structure of the notes returned by get_note_structure()
                  message:
                    type: string
                    example: "Metadata showed"


  /notes/search:
    get:
      operationId: searchNotes
      summary: Search notes
      description: >
        Full-content search with optional filters for title substring,
        creation date range, and tags. All parameters are optional and
        can be combined. Equivalent to `nb note search [title, date window]`.
      tags: [ Notes ]
      parameters:
        - name: title
          in: query
          required: false
          description: Case-insensitive substring match on title
          schema:
            type: string
            minLength: 1
            example: "shopping"
        - name: start_date
          in: query
          required: false
          description: Start of creation date window
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: false
          description: End of creation date window
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Matching notes
        '400':
          $ref: '#/components/responses/BadRequest'

  /notes/{note_id}:
    parameters:
      - $ref: '#/components/parameters/NoteId'

    get:
      operationId: getNote
      summary: Get a specific note
      tags: [ Notes ]
      responses:
        '200':
          description: The requested note
        '404':
          $ref: '#/components/responses/NotFound'


    put:
      operationId: updateNote
      summary: Update a note
      description: >
        Replaces editable fields of an existing note. You must include `type`
        so the server can validate the payload against the correct schema.
        `id`, `createdAt`, and `updatedAt` are ignored if supplied.
        Equivalent to `nb note update [id]`.
      tags: [ Notes ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdateRequest'
            examples:
              simple:
                summary: Simple text note
                value:
                  type: "simple"
                  title: "My First Note"
                  text: "Hello world!"
              list:
                summary: List note
                value:
                  type: "listnote"
                  title: "Shopping list"
                  list: [ "Milk", "Eggs", "Bread" ]
              bookmark:
                summary: Bookmark note
                value:
                  type: "bookmark"
                  title: "FastAPI Docs"
                  url: "https://fastapi.tiangolo.com"
      responses:
        '200':
          description: The updated note
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
            $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteNote
      summary: Delete a note by ID
      description: Equivalent to `nb note delete [id]`.
      tags: [ Notes ]
      responses:
        '204':
          description: Note deleted
        '400':
          $ref: '#/components/responses/BadRequest'

  /notes/{note_id}/navigate:
    parameters:
      - $ref: '#/components/parameters/NoteId'


    get:
      operationId: navigateNote
      summary: Fetch the content of a bookmark URL
      description: >
        Server-side proxies and returns the content of the URL stored in a
        bookmark note. Equivalent to `nb note navigate [id]`.
        Returns `422` if the note is not of type `bookmark`.
      tags: [ Notes ]
      responses:
        '200':
          description: Raw content of the bookmarked URL
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
            description: Note is not a bookmark
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
        '502':
            description: Could not fetch the bookmarked URL
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

components:
  parameters:
    NoteId:
      name: note_id
      in: path
      required: true
      description: Unique numeric note identifier
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 42

  schemas:
    NoteType:
      type: string
      enum:
        - simple
        - listnote
        - bookmark
      description: The type of note to create or update
      example: simple

    NoteBase:
      type: object
      description: Fields present on every note (all server-managed fields are readOnly)
      required: [ note_id, title, note_type, createdAt, updatedAt ]
      properties:
        note_id:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Server-assigned unique identifier
          example: 42
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "My note title"
        note_type:
          $ref: '#/components/schemas/NoteType'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Set by the server on creation; ISO 8601
          example: "2026-07-21T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Updated by the server on every write; ISO 8601
          example: "2026-07-21T12:30:00Z"

    SimpleNote:
      allOf:
        - $ref: '#/components/schemas/NoteBase'
        - type: object
          required: [ text ]
          properties:
            type:
              type: string
              enum: [ simple ]
            text:
              type: string
              minLength: 1
              description: Plain text body of the note
              example: "Remember to call the dentist."

    ListNote:
      allOf:
        - $ref: '#/components/schemas/NoteBase'
        - type: object
          required: [ list ]
          properties:
            type:
              type: string
              enum: [ list ]
            list:
              type: array
              description: Ordered list items
              minItems: 1
              items:
                type: string
                minLength: 1
              example: [ "Buy milk", "Buy eggs" ]
    BookmarkNote:
      allOf:
        - $ref: '#/components/schemas/NoteBase'
        - type: object
          required: [ url ]
          properties:
            type:
              type: string
              enum: [ bookmark ]
            url:
              type: string
              format: uri
              description: The bookmarked URL
              example: "https://example.com"

    NoteCreateRequest:
      type: object
      required:
        - type
        - title
      properties:
        type:
          $ref: '#/components/schemas/NoteType'

        title:
          type: string
          description: The title of a note
          minLength: 1
          maxLength: 255

        text:
          type: string
          description: The content of a simple note
          minLength: 1

        list:
          type: array
          description: The content of a list note
          minItems: 1
          items:
            type: string
            minLength: 1

        url:
          type: string
          description: The content of a bookmark note
          format: uri

    NoteUpdateRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/NoteType'

        title:
          type: string
          description: The title of a note
          minLength: 1
          maxLength: 255

        text:
          type: string
          description: The content of a simple note
          minLength: 1

        list:
          type: array
          description: The content of a list note
          minItems: 1
          items:
            type: string
            minLength: 1

        url:
          type: string
          description: The content of a bookmark note
          format: uri

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 404

        message:
          type: string
          example: "Note not found"

        details:
          type: array
          items:
            type: string
          example:
            - "title: must not be blank"
            - "url: must be a valid URI"
  responses:
    NotFound:
      description: The requested note does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: "Note not found"

    BadRequest:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: "Validation error"
            details:
              - "title: must not be blank"
              - "url: must be a valid URI"

    ValidationError:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 422
            message: "Validation error"
            details:
              - "text: Input should be a valid string"
              - "list: Input should be a valid list"
              - "url: Input should be a valid URL, relative URL without a base"
