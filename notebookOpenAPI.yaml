openapi: 3.0.3

info:
  title: Personal Notebook API
  description: >
    REST API for managing personal notes.
    Supports three note types — **simple** (plain text), **list** (ordered items),
    and **bookmark** (saved URL). The `id`, `createdAt`, and `updatedAt` fields
    are always server-generated and must not be supplied on create/update.
  version: 1.0.0
  contact:
    email: user@server.com

tags:
  - name: Notes
    description: CRUD, search, and navigation operations on notes

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ── Collection ──────────────────────────────
  /notes:
    get:
      operationId: listNotes
      summary: List notes (metadata only)
      description: >
        Returns a paginated list of note metadata — id, type, title, createdAt,
        updatedAt. Content fields (text, list, url) are omitted.
        Equivalent to `nb note list`.
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: type
          in: query
          description: Filter by note type
          schema:
            $ref: '#/components/schemas/NoteType'
      responses:
        '200':
          description: Paginated list of note metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteMetaPage'

    post:
      operationId: createNote
      summary: Create a new note
      description: >
        Creates a new note. The `type` field acts as a discriminator —
        send `simple`, `list`, or `bookmark` and include the matching
        content field (`text`, `list`, or `url`).
        Equivalent to `nb note create simple|list|bookmark`.
      tags: [Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
            examples:
              simple:
                summary: Simple text note
                value:
                  type: simple
                  title: "My first note"
                  text: "Hello, notebook!"
                  tags: ["personal", "intro"]
              list:
                summary: List note
                value:
                  type: list
                  title: "Shopping list"
                  list: ["Milk", "Eggs", "Bread"]
                  tags: ["errands"]
              bookmark:
                summary: Bookmark note
                value:
                  type: bookmark
                  title: "OpenAPI spec reference"
                  url: "https://spec.openapis.org/oas/v3.0.3"
      responses:
        '201':
          description: Note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      operationId: deleteNotesByDate
      summary: Delete all notes created on a specific date
      description: >
        Bulk-deletes every note whose `createdAt` date matches the given date.
        Equivalent to `nb note delete [date]`.
      tags: [Notes]
      parameters:
        - name: date
          in: query
          required: true
          description: "ISO 8601 date — deletes all notes created on this day (e.g. `2026-07-21`)"
          schema:
            type: string
            format: date
            example: "2026-07-21"
      responses:
        '200':
          description: Number of notes deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Search ──────────────────────────────────
  /notes/search:
    get:
      operationId: searchNotes
      summary: Search notes
      description: >
        Full-content search with optional filters for title substring,
        creation date range, and tags. All parameters are optional and
        can be combined. Equivalent to `nb note search [title, date window, tags]`.
      tags: [Notes]
      parameters:
        - name: title
          in: query
          description: Case-insensitive substring match on title
          schema:
            type: string
            minLength: 1
            example: "shopping"
        - name: dateFrom
          in: query
          description: Start of creation date window (inclusive)
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: dateTo
          in: query
          description: End of creation date window (inclusive)
          schema:
            type: string
            format: date
            example: "2026-07-21"
        - name: tags
          in: query
          description: >
            Return only notes that contain ALL of the specified tags.
            Repeat the parameter for multiple values: `?tags=work&tags=urgent`
          schema:
            type: array
            items:
              type: string
              minLength: 1
          style: form
          explode: true
          example: ["work", "urgent"]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Matching notes (full content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePage'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Single resource ─────────────────────────
  /notes/{id}:
    parameters:
      - $ref: '#/components/parameters/NoteId'

    get:
      operationId: getNote
      summary: Get a specific note
      description: >
        Returns the full note including content fields.
        Equivalent to `nb note view [id]`.
      tags: [Notes]
      responses:
        '200':
          description: The requested note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateNote
      summary: Update a note
      description: >
        Replaces editable fields of an existing note. You must include `type`
        so the server can validate the payload against the correct schema.
        `id`, `createdAt`, and `updatedAt` are ignored if supplied.
        Equivalent to `nb note update [id]`.
      tags: [Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdateRequest'
            examples:
              simple:
                summary: Update simple note
                value:
                  type: simple
                  title: "Updated title"
                  text: "New content"
              list:
                summary: Update list note
                value:
                  type: list
                  list: ["Item A", "Item B", "Item C"]
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteNote
      summary: Delete a note by ID
      description: Equivalent to `nb note delete [id]`.
      tags: [Notes]
      responses:
        '204':
          description: Note deleted — no content returned
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Tags sub-resource ────────────────────────
  /notes/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/NoteId'

    patch:
      operationId: updateNoteTags
      summary: Replace tags on a note
      description: >
        Replaces the tag list on the note with the supplied array.
        Send an empty array to clear all tags.
        Only applicable to `simple` and `list` note types.
        Equivalent to `nb note update tag [id]`.
      tags: [Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagsUpdateRequest'
            example:
              tags: ["work", "urgent", "q3"]
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Note type does not support tags (bookmark)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Navigate (bookmark proxy) ────────────────
  /notes/{id}/navigate:
    parameters:
      - $ref: '#/components/parameters/NoteId'

    get:
      operationId: navigateNote
      summary: Fetch the content of a bookmark URL
      description: >
        Server-side proxies and returns the content of the URL stored in a
        bookmark note. Equivalent to `nb note navigate [id]`.
        Returns `422` if the note is not of type `bookmark`.
      tags: [Notes]
      responses:
        '200':
          description: Raw content of the bookmarked URL
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Note is not a bookmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Could not fetch the bookmarked URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:

  # ── Parameters ───────────────────────────────
  parameters:

    NoteId:
      name: id
      in: path
      required: true
      description: Unique numeric note identifier
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 42

    PageParam:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ── Schemas ───────────────────────────────────
  schemas:

    # ·· Enum ·····································
    NoteType:
      type: string
      enum: [simple, list, bookmark]
      description: Discriminates the note variant
      example: simple

    # ·· Shared read-only base ····················
    NoteBase:
      type: object
      description: Fields present on every note (all server-managed fields are readOnly)
      required: [id, type, title, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Server-assigned unique identifier
          example: 42
        type:
          $ref: '#/components/schemas/NoteType'
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "My note title"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Set by the server on creation; ISO 8601
          example: "2026-07-21T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Updated by the server on every write; ISO 8601
          example: "2026-07-21T12:30:00Z"

    # ·· Concrete note types (full response) ······
    SimpleNote:
      allOf:
        - $ref: '#/components/schemas/NoteBase'
        - type: object
          required: [text]
          properties:
            type:
              type: string
              enum: [simple]
            text:
              type: string
              minLength: 1
              description: Plain text body of the note
              example: "Remember to call the dentist."
            tags:
              $ref: '#/components/schemas/TagList'

    ListNote:
      allOf:
        - $ref: '#/components/schemas/NoteBase'
        - type: object
          required: [list]
          properties:
            type:
              type: string
              enum: [list]
            list:
              type: array
              description: Ordered list items
              minItems: 1
              items:
                type: string
                minLength: 1
              example: ["Buy milk", "Buy eggs"]
            tags:
              $ref: '#/components/schemas/TagList'

    BookmarkNote:
      allOf:
        - $ref: '#/components/schemas/NoteBase'
        - type: object
          required: [url]
          properties:
            type:
              type: string
              enum: [bookmark]
            url:
              type: string
              format: uri
              description: The bookmarked URL
              example: "https://example.com"

    # ·· Discriminated union (response) ···········
    Note:
      description: A note — one of simple, list, or bookmark
      oneOf:
        - $ref: '#/components/schemas/SimpleNote'
        - $ref: '#/components/schemas/ListNote'
        - $ref: '#/components/schemas/BookmarkNote'
      discriminator:
        propertyName: type
        mapping:
          simple:   '#/components/schemas/SimpleNote'
          list:     '#/components/schemas/ListNote'
          bookmark: '#/components/schemas/BookmarkNote'

    # ·· Metadata-only view (list endpoint) ·······
    NoteMeta:
      type: object
      description: Lightweight note summary — no content fields
      required: [id, type, title, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 42
        type:
          $ref: '#/components/schemas/NoteType'
        title:
          type: string
          example: "My note title"
        createdAt:
          type: string
          format: date-time
          example: "2026-07-21T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-21T12:30:00Z"

    # ·· Create request schemas ···················
    SimpleNoteCreateRequest:
      type: object
      required: [type, title, text]
      properties:
        type:
          type: string
          enum: [simple]
        title:
          type: string
          minLength: 1
          maxLength: 255
        text:
          type: string
          minLength: 1
        tags:
          $ref: '#/components/schemas/TagList'

    ListNoteCreateRequest:
      type: object
      required: [type, title, list]
      properties:
        type:
          type: string
          enum: [list]
        title:
          type: string
          minLength: 1
          maxLength: 255
        list:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        tags:
          $ref: '#/components/schemas/TagList'

    BookmarkNoteCreateRequest:
      type: object
      required: [type, title, url]
      properties:
        type:
          type: string
          enum: [bookmark]
        title:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri

    NoteCreateRequest:
      description: >
        Payload for creating a note. Supply `type` first — it selects which
        additional fields are required (`text`, `list`, or `url`).
        Do NOT send `id`, `createdAt`, or `updatedAt`.
      oneOf:
        - $ref: '#/components/schemas/SimpleNoteCreateRequest'
        - $ref: '#/components/schemas/ListNoteCreateRequest'
        - $ref: '#/components/schemas/BookmarkNoteCreateRequest'
      discriminator:
        propertyName: type
        mapping:
          simple:   '#/components/schemas/SimpleNoteCreateRequest'
          list:     '#/components/schemas/ListNoteCreateRequest'
          bookmark: '#/components/schemas/BookmarkNoteCreateRequest'

    # ·· Update request schemas ···················
    SimpleNoteUpdateRequest:
      type: object
      required: [type]
      description: At least one content field must change
      properties:
        type:
          type: string
          enum: [simple]
        title:
          type: string
          minLength: 1
          maxLength: 255
        text:
          type: string
          minLength: 1
        tags:
          $ref: '#/components/schemas/TagList'

    ListNoteUpdateRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [list]
        title:
          type: string
          minLength: 1
          maxLength: 255
        list:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        tags:
          $ref: '#/components/schemas/TagList'

    BookmarkNoteUpdateRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [bookmark]
        title:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri

    NoteUpdateRequest:
      description: >
        Payload for updating a note. Include `type` so the server validates
        only the fields relevant to that note variant.
      oneOf:
        - $ref: '#/components/schemas/SimpleNoteUpdateRequest'
        - $ref: '#/components/schemas/ListNoteUpdateRequest'
        - $ref: '#/components/schemas/BookmarkNoteUpdateRequest'
      discriminator:
        propertyName: type
        mapping:
          simple:   '#/components/schemas/SimpleNoteUpdateRequest'
          list:     '#/components/schemas/ListNoteUpdateRequest'
          bookmark: '#/components/schemas/BookmarkNoteUpdateRequest'

    # ·· Tags patch ·······························
    TagsUpdateRequest:
      type: object
      required: [tags]
      description: Replaces the full tag list. Send `[]` to clear all tags.
      properties:
        tags:
          $ref: '#/components/schemas/TagList'

    # ·· Shared building blocks ···················
    TagList:
      type: array
      description: Unordered set of lowercase tag strings
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 50
        pattern: '^[a-z0-9_\-]+$'
        description: Lowercase alphanumeric; hyphens and underscores allowed
      default: []
      example: ["work", "urgent"]

    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total number of matching records

    NoteMetaPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NoteMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'

    NotePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        pagination:
          $ref: '#/components/schemas/Pagination'

    BulkDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Number of notes that were deleted
          example: 3

    # ·· Error envelope ···························
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: "Note not found"
        details:
          type: array
          description: Field-level validation errors
          items:
            type: string
          example: ["title: must not be blank", "url: must be a valid URI"]

  # ── Reusable responses ────────────────────────
  responses:

    NotFound:
      description: The requested note does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: "Note not found"

    BadRequest:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: "Validation error"
            details:
              - "title: must not be blank"
              - "url: must be a valid URI"