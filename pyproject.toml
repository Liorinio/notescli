[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notecli"
version = "2.5.0"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.0",
]

[project.scripts]
notecli = "notecli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["notecli*"]
