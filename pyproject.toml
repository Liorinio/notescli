[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notecli"
version = "0.1.0"
dependencies = [
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "typer>=0.16.0",
]

[project.scripts]
notecli = "notecli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["notecli*"]
