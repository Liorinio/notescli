# tells build tools how the project should be built
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# defines the project's metadata
[project]
name = "notecli"
version = "2.6.0"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic==2.14.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "typer==0.27.3",
    "fastapi>=0.156.8",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "pika>=1.4.4",
    "python3-pika>=0.9.14",
    "booktype>=1.5",
    "urllib3>=2.8.0"
]

# maps a shell command to the "main" python function
[project.scripts]
notecli = "notecli.cli:app"

# configures how setuptools automatically discovers and bundles the Python packages in the project.
[tool.setuptools.packages.find]
where = ["."]
include = ["notecli*"]
